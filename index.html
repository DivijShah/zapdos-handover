<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The 24/7 Handover · v4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Read-only. Open from file://. Data: handover/site.js + handover/heartbeat.js, rewritten by `python run.py` every tick; this page re-reads them every 3 s.
     v3: two-city handover layout. reload/tickAge/demoTab/audit/caught plumbing identical to index.html; only the board renderer + CSS differ. -->
<style>
:root{
  --bg:#07090e; --bg2:#0b0f17; --surface:rgba(255,255,255,.04); --surface2:rgba(255,255,255,.07);
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.14);
  --fg:#f3f6fb; --body:#c9d2e0; --dim:#8b96aa; --dim2:#5f6a7d; --ink:#0d1118;
  --amber:#ffc83d; --red:#ff5f5f; --green:#3ddc84; --violet:#b9a3ff; --cyan:#5ad1f0;
  --sam:#ff9f43; --weilin:#4dabf7; --dana:#e599f7; --priya:#63e6be; --system:#9aa5b8;
  --lane:rgba(14,18,27,.72); --glow:rgba(255,212,59,.95); --glow2:rgba(255,212,59,.5); --glowbg:rgba(255,212,59,.14);
  --shadow:0 20px 50px rgba(0,0,0,.45);
  --r:16px; --rs:9px; --ease:cubic-bezier(.2,.8,.2,1);
  --grad1:rgba(77,171,247,.10); --grad2:rgba(185,163,255,.08);
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --surface:rgba(16,22,34,.035); --surface2:rgba(16,22,34,.06);
  --hair:rgba(16,22,34,.09); --hair2:rgba(16,22,34,.16);
  --fg:#0f1420; --body:#2b3445; --dim:#5f6a7d; --dim2:#8b96aa; --ink:#0d1118;
  --amber:#f5b400; --red:#e5484d; --green:#1f9d55; --violet:#7c5cff; --cyan:#0e8fb3;
  --lane:rgba(255,255,255,.72); --glow:rgba(245,180,0,.9); --glow2:rgba(245,180,0,.35); --glowbg:rgba(245,180,0,.14);
  --shadow:0 20px 50px rgba(16,22,34,.12);
  --grad1:rgba(77,171,247,.14); --grad2:rgba(185,163,255,.14);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--body);
  font:20px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px 20px 10px;
  background:radial-gradient(1200px 600px at 12% -10%,var(--grad1),transparent 60%),radial-gradient(900px 500px at 95% 110%,var(--grad2),transparent 60%),linear-gradient(var(--bg2),var(--bg));
  transition:background .4s var(--ease),color .4s var(--ease)}
a{color:inherit;text-decoration:none}

/* header */
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.05;color:var(--fg);white-space:nowrap}
h1 em{font-style:normal;font-weight:500;color:var(--dim)}
#banner{display:none;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.01em;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.right{display:flex;align-items:center;gap:12px}
#pill{font-size:21px;font-weight:800;letter-spacing:-.01em;border-radius:999px;padding:8px 20px 8px 15px;color:#052a14;background:var(--green);
  box-shadow:0 0 0 1px rgba(61,220,132,.35),0 8px 28px rgba(61,220,132,.28);white-space:nowrap;display:flex;align-items:center;gap:10px;
}
body.ready #pill{transition:background .35s var(--ease),box-shadow .35s var(--ease),color .35s var(--ease)}
#pill i{width:12px;height:12px;border-radius:50%;background:#052a14;display:inline-block;animation:pulse 1.6s infinite}
#pill.off{background:var(--red);color:#330808;box-shadow:0 0 0 1px rgba(255,95,95,.4),0 8px 28px rgba(255,95,95,.3)}#pill.off i{animation:none;background:#330808}
#pill.proc{background:var(--amber);color:#3a2a00;box-shadow:0 0 0 1px rgba(255,200,61,.4),0 8px 28px rgba(255,200,61,.3)}#pill.proc i{background:#3a2a00}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
nav{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--hair)}
nav button,#theme{font-weight:600;font-size:16px;letter-spacing:-.005em;font-family:inherit;color:var(--dim);background:transparent;border:0;border-radius:999px;padding:6px 16px;cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease),transform .1s ease-out}
nav button:active,#theme:active{transform:scale(.97)}
nav button.on{color:var(--bg);background:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.25)}
#theme{border:1px solid var(--hair);background:var(--surface2);padding:6px 12px;font-size:18px;line-height:1}

/* board: Austin | lane | Singapore */
main{min-height:0}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 460px minmax(0,1fr);gap:18px;height:100%;min-height:0}
.city{display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);gap:14px;min-height:0}
.cityhead{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px 0}
.cityhead h2{font-size:17px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.cityhead .clk{font-size:34px;font-weight:800;letter-spacing:-.025em;color:var(--fg);font-variant-numeric:tabular-nums}
.cityhead .clk small{font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--dim);margin-left:8px}
.person{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:16px 20px 14px 22px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);position:relative}
.person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc);border-radius:var(--r) 0 0 var(--r)}
.who{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.who .nm{font-size:34px;font-weight:800;letter-spacing:-.025em;color:var(--fg);line-height:1.05}
.who .nm small{font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--dim);margin-left:10px}
.who .cnt{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}
.who .cnt b{color:var(--body);font-weight:800;letter-spacing:0;font-size:17px}
.grp{min-height:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.grp h3{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;border-top:1px solid var(--hair)}
.grp h3 b{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:0;background:var(--surface2);border-radius:999px;padding:0 8px;min-width:22px;text-align:center}
.grp.owed,.grp.sent{flex:0 0 auto}.grp.ask{flex:1 1 0;min-height:0}.grp.sent .sentrow{max-height:40px;overflow:hidden;flex-wrap:nowrap}
.it{padding:9px 14px 9px 16px;border-left:3px solid var(--hair2);border-radius:6px var(--rs) var(--rs) 6px;overflow:hidden;background:var(--surface)}
.it .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg);font-weight:600;font-size:24px;letter-spacing:-.015em;line-height:1.2}
.ask .it{border-left-color:var(--amber)}.ask .it .t{font-weight:500;font-size:21px;color:var(--body);-webkit-line-clamp:2;line-height:1.25}
.ask .it{flex:0 0 auto}.sup-it .t{-webkit-line-clamp:2}
.meta{font-size:16px;color:var(--dim);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:24px;overflow:hidden;letter-spacing:.005em}
.c{font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;background:var(--surface2);border:1px solid var(--hair);border-radius:6px;padding:0 7px;color:var(--body)}
a.c:hover,a.pl:hover{border-color:var(--hair2);color:var(--fg)}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:2px 7px;color:var(--ink);white-space:nowrap;background:#8b96aa}
.tag.due{font-size:15px;letter-spacing:.02em;background:var(--amber)}.tag.over{font-size:15px;letter-spacing:.02em;background:var(--red);color:#fff}
.tag.upd{background:var(--violet)}.tag.sentt{background:var(--green);color:#052a14}.tag.prog{background:var(--cyan)}
.sup-it{border-left-color:var(--violet)!important;background:color-mix(in srgb,var(--violet) 10%,transparent)}
.sup-it .t{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--violet);color:var(--violet);font-weight:500}
.more{font-size:13px;color:var(--dim2);padding-left:12px;letter-spacing:.01em}
.sentrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:17px;flex:0 1 auto;min-width:0;max-width:46%;font-weight:600;color:var(--fg);background:var(--surface2);border:1px solid var(--hair);border-radius:999px;padding:3px 11px 3px 8px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.sentrow .chip{max-width:40%}.sentrow .chip[data-more]{flex:none;max-width:none}
.chip a,.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.draft i{background:var(--dim2)}

/* lane */
.lane{background:var(--lane);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--hair2);border-radius:var(--r);padding:12px 14px 10px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--shadow)}
.lane h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:baseline}
.lane h2 b{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:0;background:var(--surface2);border-radius:999px;padding:0 8px}
.hands{display:flex;flex-direction:column;gap:6px;flex:0 1 auto;min-height:0;overflow:hidden}
.ho{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:7px 10px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--hair)}
.ho .arrow{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ho .arrow .pb{min-width:58px;text-align:center}
.ho .arrow .ar{font-size:18px;line-height:1;color:var(--dim)}
.ho .tx{font-size:19px;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ho .meta{margin-top:3px}
.pb{font-size:11px;font-weight:800;color:var(--ink);border-radius:5px;padding:1px 7px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.b-sam{background:var(--sam)}.b-weilin{background:var(--weilin)}.b-dana{background:var(--dana)}.b-priya{background:var(--priya)}.b-system{background:var(--system)}
.feed{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.fl{border-left:3px solid var(--system);padding:4px 8px 4px 10px;border-radius:6px var(--rs) var(--rs) 6px;background:var(--surface)}
.fl .h{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.02em;color:var(--dim2);margin-bottom:1px}
.fl .tx{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--body);font-size:18px}
.fl.k-caught{background:color-mix(in srgb,var(--red) 12%,transparent)}.fl.k-sup .tx{color:var(--violet)}.fl.k-sent .tx{color:var(--green)}
.caughtbox{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:20px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--hair)}
.caughtbox .z{color:var(--green);font-weight:700}.caughtbox .n{color:var(--red);font-weight:700}

/* footer */
footer{font:600 18px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.01em;color:var(--dim);border-top:1px solid var(--hair);padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--green)}footer b.bad{color:var(--red)}

/* motion */
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes glow{0%,30%{box-shadow:0 0 0 2px var(--glow),0 0 28px var(--glow2);background:var(--glowbg)}100%{box-shadow:0 0 0 0 transparent;background:var(--surface)}}
.new{animation:slide .42s var(--ease),glow 2.2s var(--ease);will-change:transform,opacity}
@keyframes strike{from{background-size:0 3px}to{background-size:100% 3px}}
.newsup .t{text-decoration:none;background:linear-gradient(var(--violet),var(--violet)) no-repeat 0 58%/0 3px;animation:strike .8s var(--ease) forwards}
.newsup{animation:glow 2.2s var(--ease)}
@media (prefers-reduced-motion:reduce){.new,.newsup{animation:glow 1.2s ease-out}.newsup .t{animation:none;background-size:100% 3px}#pill i{animation:none}}
@media (prefers-reduced-transparency:reduce){.lane{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2)}}

/* audit + caught tabs (unchanged structure) */
.audit{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--fg)}.big b{color:var(--green)}.big b.bad{color:var(--red)}
.big small{display:block;font-size:15px;font-weight:400;letter-spacing:0;color:var(--dim);margin:6px 0 0}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.acol{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:12px;overflow:auto;min-height:0}
.badge{align-self:flex-start;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink);border-radius:11px;padding:4px 15px 4px 13px;margin-bottom:4px;display:inline-block}
.badge small{font-size:15px;font-weight:600;margin-left:9px;opacity:.72}
.afile{margin-top:10px;font:13px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.02em;color:var(--dim2);word-break:break-all}.afile b{color:var(--body)}
.fact{font-size:17px;margin-top:5px;padding:4px 0 4px 10px;border-left:3px solid var(--green);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--green) 6%,transparent);color:var(--fg)}
.fact.un{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}.fact.unc{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,transparent)}
.fact .q{display:block;font-size:14px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.cwrap{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:16px 20px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:12px}
.caught{border-left:3px solid var(--red);padding-left:10px}.cwrap .caught{font-size:20px}.cwrap .ex{font-size:15px;color:var(--dim);margin-top:3px}
.zero{color:var(--green);font-weight:700}

/* ── detail sheet (click any card / chip / line; +N more opens the full list) ── */
.it,.chip,.ho,.fl,.more[data-more]{cursor:pointer}
.it:hover,.ho:hover,.fl:hover{background:var(--surface2)}
.more[data-more]:hover{color:var(--body);text-decoration:underline}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:40}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,60vw);background:var(--lane);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  border-left:1px solid var(--hair2);box-shadow:-30px 0 80px rgba(0,0,0,.45);transform:translateX(102%);transition:transform .42s var(--ease);z-index:50;display:flex;flex-direction:column;padding:26px 30px;gap:14px;overflow:auto}
body.open #scrim{opacity:1;pointer-events:auto}body.open #sheet{transform:none}
#sheet .k{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
#sheet .k button{font:600 16px/1 inherit;font-family:inherit;color:var(--dim);background:var(--surface2);border:1px solid var(--hair);border-radius:999px;padding:7px 14px;cursor:pointer}
#sheet h2.tt{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--fg)}
#sheet h2.tt.sup{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--violet);color:var(--violet)}
#sheet .body{font-size:20px;line-height:1.45;color:var(--body);white-space:pre-wrap}
#sheet .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:16px;color:var(--dim)}
#sheet .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-top:6px}
#sheet ul{padding-left:22px;font-size:18px;line-height:1.45;color:var(--body)}
#sheet a.file{display:inline-block;font:15px ui-monospace,Menlo,monospace;color:var(--fg);background:var(--surface2);border:1px solid var(--hair);border-radius:8px;padding:6px 10px}
#sheet .list .it{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){#sheet{transition:opacity .25s ease;transform:none;opacity:0;pointer-events:none}body.open #sheet{opacity:1;pointer-events:auto}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="h1">The 24/7 Handover <em>· Zapdemo</em></h1><div id="banner">waiting for the first tick…</div></div>
  <div class="right"><div id="pill" class="off"><i></i><span>NOT RUNNING</span></div>
    <nav><button id="tab-board" onclick="tab('board')">Handover</button><button id="tab-audit" onclick="tab('audit')">Audit</button><button id="tab-caught" onclick="tab('caught')">Caught itself</button></nav>
    <button id="theme" onclick="toggleTheme()" title="light / dark">◐</button></div>
</header>
<main id="main"></main>
<div id="scrim" onclick="closeSheet()"></div>
<aside id="sheet" aria-hidden="true"></aside>
<footer id="footer"></footer>
<script src="handover/site.js"></script>
<script src="handover/heartbeat.js"></script>
<script>
"use strict";
/* ── theme ─────────────────────────────────────────── */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);document.getElementById("theme").textContent=t==="light"?"☾":"☀";}
function toggleTheme(){var t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";applyTheme(t);try{localStorage.setItem("handover-theme",t)}catch(e){}}
(function(){var t="dark";try{t=localStorage.getItem("handover-theme")||t}catch(e){}applyTheme(t)})();

/* ── shared helpers (same as index.html) ───────────── */
var CITY={austin:{label:"Austin",tz:"America/Chicago",people:["sam","dana"]},singapore:{label:"Singapore",tz:"Asia/Singapore",people:["weilin","priya"]}};
var LIM={owed:1,ask:1};
var TAB=(location.hash||"#board").slice(1), prev=null, lastSig="";
var ctx={cur:{},curSup:{},curFeed:{}};
var REG=[], CUR_P=null, NAMES={};
function reg(kind,o,extra){REG.push({kind:kind,o:o,x:extra||{}});return ' data-r="'+(REG.length-1)+'"'}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function srcChip(x){return '<a class="c" href="handover/sources/'+encodeURIComponent(x)+'.txt" target="_blank" rel="noopener" title="open the verbatim source record">'+esc(x)+'</a>'}
function chips(a,n,plain){return (a||[]).slice(0,n||5).map(function(x){return plain?'<span class="c">'+esc(x)+'</span>':srcChip(x)}).join("")}
function fileLink(path,html){return path?'<a class="pl" href="'+esc(path)+'" target="_blank" rel="noopener" title="open the outbox file">'+html+'</a>':html}
function isNew(id){ctx.cur[id]=1;return prev&&!prev.ids[id]?" new":""}
function pb(who){return '<span class="pb b-'+esc(who)+'">'+esc(who)+'</span>'}
function qline(t){t=String(t||"").replace(/ _\(.*$/,"");var ss=t.match(/[^.?!]+[.?!]+/g)||[t];for(var i=0;i<ss.length;i++){if(/\?/.test(ss[i]))return ss[i].trim()}return ss[0].trim()}
function first(name){return name.split(" ").slice(0,-1).join(" ")||name}
function cityClock(iso,tz){var d=new Date(iso),o={timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"},p={};
  new Intl.DateTimeFormat("en-GB",o).formatToParts(d).forEach(function(x){p[x.type]=x.value});return {t:p.hour+":"+p.minute,d:p.weekday}}

/* ── v3 board renderer ─────────────────────────────── */
function owedIt(p){
  var t=(p.updated?'<span class="tag upd">UPDATED</span> ':'')+(p.status==="in_progress"?'<span class="tag prog">IN PROGRESS</span> ':'');
  var due=p.due?'<span class="tag '+(p.overdue?'over':'due')+'">'+(p.overdue?'OVERDUE ':'due ')+esc(p.due)+'</span>'+(p.due_src?srcChip(p.due_src):''):'';
  return '<div class="it'+isNew(p.id)+'"'+reg('owed',p)+'><div class="t">'+t+esc(p.title)+'</div><div class="meta">'+due+chips(p.sources,p.due?1:2)+'</div></div>';
}
function askIt(q){
  var due=q.due?'<span class="tag '+(q.overdue?'over':'due')+'">'+(q.overdue?'OVERDUE ':'due ')+esc(q.due)+'</span>'+(q.due_src?srcChip(q.due_src):''):'';
  return '<div class="it'+isNew(q.id)+'"'+reg('ask',q,{to:CUR_P})+'><div class="t">'+esc(qline(q.text))+'</div><div class="meta">'+due+'<span>asked by '+esc(q["from"])+"'s AI</span></div></div>";
}
function supIt(s){
  ctx.curSup[s.id]=1; var fresh=prev&&!prev.sup[s.id]?" newsup":"";
  return '<div class="it sup-it'+fresh+'"'+reg('sup',s)+'><div class="t">'+esc(s.title)+'</div><div class="meta"><span class="tag upd">SUPERSEDED</span><span>by '+esc(s.by)+(s.fact?': “'+esc(s.fact)+'”':"")+'</span></div></div>';
}
function sentChip(p){
  var sent=p.status==="sent", label=esc(p.title.replace(/^SENT: /,"").replace(/^Re: /,""));
  var to=((p.notes||[""])[0]||"").split("  ·  ")[0].replace(/^→\s*/,"").split("@")[0];
  var inner='<i></i>'+(sent&&to?esc(to)+' · ':'')+label;
  return '<span class="chip'+(sent?'':' draft')+isNew(p.id)+'"'+reg('done',p)+'>'+(sent?fileLink(p.path,inner):inner)+'</span>';
}
function person(p){
  CUR_P=p.id; NAMES[p.id]=first(p.name);
  var sup=(p.superseded||[]).map(supIt).join("");
  var owedN=p.owed.length, askN=p.waiting.length, doneN=p.done.length;
  var sent=p.done.slice().reverse().filter(function(x){return x.status==="sent"});
  var other=p.done.slice().reverse().filter(function(x){return x.status!=="sent"});
  return '<section class="person" style="--pc:var(--'+esc(p.id)+')">'+
    '<div class="who"><div class="nm">'+esc(first(p.name))+'<small>'+esc(p.role)+'</small></div><div class="cnt"><b>'+owedN+'</b> owed · <b>'+askN+'</b> asked · <b>'+doneN+'</b> done</div></div>'+
    '<div class="grp owed"><h3><span>Owed</span><b>'+owedN+'</b></h3>'+sup+p.owed.slice(0,sup?0:LIM.owed).map(owedIt).join("")+(owedN>(sup?0:LIM.owed)?'<div class="more" data-more="'+esc(p.id)+':owed">+'+(owedN-(sup?0:LIM.owed))+' more — click to see all '+owedN+'</div>':'')+'</div>'+
    '<div class="grp sent"><h3><span>Done by the AI</span><b>'+doneN+'</b></h3><div class="sentrow">'+(function(){var all=sent.concat(other),sh=all.slice(0,2).map(sentChip).join("");return (sh+(all.length>2?'<span class="chip draft" data-more="'+esc(p.id)+':done">+'+(all.length-2)+' more</span>':''))||'<div class="more">nothing yet</div>'})()+'</div></div>'+
    '<div class="grp ask"><h3><span>Decisions for '+esc(first(p.name))+' · one tap each</span><b>'+askN+'</b></h3>'+(p.waiting.slice(0,LIM.ask).map(askIt).join("")||'<div class="more">none</div>')+(askN>LIM.ask?'<div class="more" data-more="'+esc(p.id)+':waiting">+'+(askN-LIM.ask)+' more — click to see all '+askN+'</div>':'')+'</div>'+
  '</section>';
}
function city(key,S){
  var c=CITY[key], ck=cityClock(S.clock,c.tz);
  var ppl=c.people.map(function(id){return S.people.filter(function(p){return p.id===id})[0]}).filter(Boolean);
  return '<div class="city"><div class="cityhead"><h2>'+c.label+'</h2><div class="clk">'+ck.t+'<small>'+ck.d+'</small></div></div>'+ppl.map(person).join("")+'</div>';
}
function handover(h,to){
  var id="h:"+to+":"+(h.text||h.title||"").slice(0,60);
  var from=h["from"]||"system"; if(from===to) from="system";
  return '<div class="ho'+isNew(id)+'"'+reg('hand',h,{to:to,from:from})+'><div class="arrow">'+pb(from)+'<span class="ar">↓</span>'+pb(to)+'</div><div><div class="tx">'+esc(h.text||h.title)+'</div><div class="meta">'+chips(h.cite||h.sources,3)+'</div></div></div>';
}
function feedLine(f){
  ctx.curFeed[f.key]=1; var fresh=prev&&!prev.feed[f.key]?" new":"";
  return '<div class="fl k-'+esc(f.kind)+fresh+'"'+reg('feed',f)+' style="border-left-color:var(--'+esc(f.persona)+')"><div class="h">'+esc(f.time||"earlier")+pb(f.persona)+'</div><div class="tx">'+esc(String(f.text).replace(/^asked \w+: /,"asked: "))+'</div></div>';
}
function board(S){
  var hos=[]; S.people.forEach(function(p){(p.handed||[]).forEach(function(h){hos.push(handover(h,p.id))})});
  var rj=S.rejected_total||0;
  var lane='<div class="lane"><h2><span>Handed across the shift</span><b>'+hos.length+'</b></h2><div class="hands">'+(hos.slice(0,2).join("")||'<div class="more">nothing crossing yet</div>')+'</div>'+
    '<h2><span>Live</span><b>'+(S.feed||[]).length+'</b></h2><div class="feed">'+(S.feed||[]).slice(0,8).map(feedLine).join("")+'</div>'+
    '<div class="caughtbox"><span>Caught itself</span>'+(rj?'<span class="n">'+rj+' withheld</span>':'<span class="z">0 — nothing rejected yet</span>')+'</div></div>';
  return '<div class="stage">'+city("austin",S)+lane+city("singapore",S)+'</div>';
}

/* ── audit / caught views: same as index.html ──────── */
function auditView(S){
  var A=S.audit||{groups:[],checked:0,unsourced:0,uncited:0};
  var html='<div class="audit"><div class="big"><b'+(A.unsourced?' class="bad"':'')+'>token audit: '+A.checked+' checked · '+A.unsourced+' unsourced</b>'+
    (A.uncited?'<small>'+A.uncited+' found in the pack but not in a cited source</small>':'')+
    '<small>automated token audit — numbers, dates, $ and names in outbound text, matched verbatim against cited sources · python run.py --audit</small></div><div class="agrid">';
  A.groups.forEach(function(g){
    var n=g.files.reduce(function(a,f){return a+f.facts.length},0);
    html+='<div class="acol"><div class="badge b-'+esc(g.persona)+'">'+esc(first(g.name))+'<small>'+n+' facts</small></div>';
    g.files.forEach(function(f){
      var key=f.facts.filter(function(x){return /[\d$]/.test(x.fact)||!x.src||x.uncited}).slice(0,4), rest=f.facts.length-key.length;
      html+='<div class="afile"><b>'+esc(f.file.replace("outbox/","").replace(/\d{8}-\d{4}-/,""))+'</b> · '+f.facts.length+' facts</div>';
      key.forEach(function(x){html+='<div class="fact'+(x.src?(x.uncited?' unc':''):' un')+'">'+esc(x.fact)+' '+(x.src?srcChip(x.src):'<span class="c">NOT FOUND</span>')+'<span class="q">'+esc(x.line||"")+'</span></div>'});
      if(rest>0) html+='<div class="more">+'+rest+' more sourced</div>';
    });
    html+='</div>';
  });
  return html+'</div></div>';
}
function caughtView(S){
  var rj=S.rejected||[];
  var body=rj.length?rj.map(function(r){return '<div class="caught"><div>'+pb(r.persona)+' '+esc(r.reason)+'</div><div class="meta">'+chips(r.offending,8,true)+'<span>'+esc((r.at||"").slice(0,16))+'</span></div><div class="ex">'+esc(r.excerpt||"")+'</div></div>'}).join("")
    :'<div class="zero" style="font-size:34px">0 — nothing rejected yet</div>';
  return '<div class="cwrap"><div class="big">Caught itself · '+(S.rejected_total||0)+'<small>drafts the fact check rejected and questions that replaced a guess · python run.py --rejections</small></div>'+body+'</div>';
}


/* ── detail sheet ─────────────────────────────────── */
function closeSheet(){document.body.classList.remove("open");document.getElementById("sheet").setAttribute("aria-hidden","true")}
function openSheet(html){var sh=document.getElementById("sheet");sh.innerHTML=html;sh.scrollTop=0;sh.setAttribute("aria-hidden","false");document.body.classList.add("open")}
function head(k){return '<div class="k"><span>'+esc(k)+'</span><button onclick="closeSheet()">Close ✕</button></div>'}
function srcList(a){return '<div class="lbl">Sources</div><div class="row">'+chips(a,50)+'</div>'}
function notes(a){a=(a||[]).filter(Boolean);return a.length?'<div class="lbl">Notes</div><ul>'+a.map(function(n){return '<li>'+esc(n)+'</li>'}).join("")+'</ul>':''}
function badges(o){var b='';if(o.status)b+='<span class="tag '+(o.status==="sent"?"sentt":o.status==="in_progress"?"prog":"")+'">'+esc(String(o.status).replace("_"," "))+'</span>';
  if(o.due)b+='<span class="tag '+(o.overdue?'over':'due')+'">'+(o.overdue?'OVERDUE ':'due ')+esc(o.due)+'</span>'+(o.due_src?srcChip(o.due_src):'');
  if(o.updated)b+='<span class="tag upd">UPDATED</span>';return b?'<div class="row">'+b+'</div>':''}
function detail(e){
  var o=e.o,k=e.kind,h='';
  if(k==="owed")h=head("Promise")+'<h2 class="tt">'+esc(o.title)+'</h2>'+badges(o)+(o.new_fact?'<div class="body">“'+esc(o.new_fact)+'”</div>':'')+notes(o.notes)+srcList(o.sources)+(o.path?'<div class="lbl">File</div>'+fileLink(o.path,'<span class="file">'+esc(o.path)+'</span>'):'')+'<div class="lbl">id</div><div class="row"><span class="c">'+esc(o.id)+'</span></div>';
  else if(k==="ask")h=head("Question to "+esc(NAMES[e.x.to]||e.x.to||"owner"))+'<h2 class="tt">'+esc(qline(o.text))+'</h2>'+badges(o)+'<div class="body">'+esc(String(o.text).replace(/ _\(.*$/,""))+'</div><div class="row">asked by '+esc(o["from"])+"'s AI · never asked in the room</div>"+(o.due_src?srcList([o.due_src]):'')+(o["re"]?'<div class="lbl">Promise</div><div class="row"><span class="c">'+esc(o["re"])+'</span></div>':'');
  else if(k==="sup")h=head("Superseded")+'<h2 class="tt sup">'+esc(o.title)+'</h2><div class="body">Replaced by '+esc(o.by)+(o.fact?': “'+esc(o.fact)+'”':'')+'</div>'+srcList(o.sources||[o.by]);
  else if(k==="done")h=head(o.status==="sent"?"Sent by the AI":"Done")+'<h2 class="tt">'+esc(o.title.replace(/^SENT: /,""))+'</h2>'+badges(o)+notes(o.notes)+srcList(o.sources)+(o.path?'<div class="lbl">Open the file</div>'+fileLink(o.path,'<span class="file">'+esc(o.path)+'</span>'):'');
  else if(k==="hand")h=head("Handed "+esc(e.x.from)+" → "+esc(e.x.to))+'<div class="body">'+esc(o.text||o.title)+'</div>'+srcList(o.cite||o.sources);
  else if(k==="feed")h=head("Activity · "+esc(o.time||"earlier")+" · "+esc(o.persona))+'<div class="body">'+esc(o.text)+'</div>'+srcList(o.cites);
  openSheet(h);
}
function listSheet(pid,grp){
  var S=window.SITE,p=S.people.filter(function(x){return x.id===pid})[0]; if(!p)return;
  var items=p[grp]||[], label={owed:"Owed",waiting:"Decisions for "+first(p.name),done:"Done by the AI"}[grp]||grp;
  var render={owed:owedIt,waiting:askIt,done:function(x){return '<div class="it"'+reg('done',x)+'><div class="t">'+esc(x.title.replace(/^SENT: /,""))+'</div><div class="meta">'+(x.status==="sent"?'<span class="tag sentt">SENT</span>':'')+chips(x.sources,4)+'</div></div>'}}[grp];
  CUR_P=pid; var saved=prev; prev=null;  // list rendering must not count as "new"
  var html=head(first(p.name)+" · "+label+" · "+items.length)+'<div class="list">'+items.map(render).join("")+'</div>';
  prev=saved; openSheet(html);
}
document.addEventListener("click",function(ev){
  var a=ev.target.closest("a"); if(a) return;                       // links keep working
  var m=ev.target.closest("[data-more]"); if(m){var q=m.getAttribute("data-more").split(":");listSheet(q[0],q[1]);return}
  var r=ev.target.closest("[data-r]"); if(r){var e=REG[+r.getAttribute("data-r")]; if(e) detail(e)}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeSheet()});

/* ── plumbing: identical behaviour to index.html ───── */
function render(force){
  var S=window.SITE; if(!S) return;
  var sig=JSON.stringify(S)+TAB;
  if(sig===lastSig&&!force) return;
  var main=document.getElementById("main"), keep=[];
  [].forEach.call(main.querySelectorAll(".acol,.cwrap"),function(e){keep.push(e.scrollTop)});
  ctx={cur:{},curSup:{},curFeed:{}}; REG=[];
  main.innerHTML=TAB==="audit"?auditView(S):TAB==="caught"?caughtView(S):board(S);
  [].forEach.call(main.querySelectorAll(".acol,.cwrap"),function(e,i){e.scrollTop=keep[i]||0});
  if(TAB==="board"){prev={ids:ctx.cur,sup:ctx.curSup,feed:ctx.curFeed};}
  lastSig=sig;
  ["board","audit","caught"].forEach(function(t){document.getElementById("tab-"+t).className=t===TAB?"on":""});
}
function tab(t){TAB=t;location.hash=t;render(true)}
var autoTab=false;
function demoTab(){
  var h=window.HEARTBEAT; if(!h||!h.demo||!h.demo.audit_at) return;
  var now=Date.now()/1000, a=h.demo.first_boot+h.demo.audit_at, b=a+(h.demo.audit_for||30);
  if(now>=a&&now<b){ if(TAB!=="audit"&&!autoTab){ autoTab=true; tab("audit"); } }
  else if(autoTab){ autoTab=false; tab("board"); }
}
function tickAge(){
  var h=window.HEARTBEAT, S=window.SITE, pill=document.getElementById("pill");
  document.getElementById("banner").textContent=(h&&h.banner)||"waiting for the first tick…";
  if(h&&h.tick_at){
    var p=h.tick_at.split(":"), d=new Date(); d.setHours(+p[0],+p[1],+p[2],0);
    var age=Math.round((Date.now()-d.getTime())/1000); if(age<0) age+=86400;
    var ok=age<=60, proc=ok&&h.processing;
    pill.className=proc?"proc":ok?"":"off";
    pill.innerHTML="<i></i><span>"+(proc?"PROCESSING DROP…":ok?"RUNNING · tick "+age+"s ago":"NOT RUNNING")+"</span>";
  }
  if(S&&S.footer){
    var f=S.footer,l=(h&&h.llm)||{calls:0,tokens:0,cost:0},up=h&&h.boot?Math.max(0,Math.round(Date.now()/1000-h.boot)):0,A=S.audit||{checked:0,unsourced:0};
    document.getElementById("footer").innerHTML=f.sources+" sources · "+f.promises+" promises · "+f.sent+" sent · "+f.asked+" asked, "+((S.stats||{}).questions||0)+" open · this session: "+l.calls+" calls · $"+l.cost.toFixed(2)+
      " · up "+Math.floor(up/3600)+"h"+("0"+Math.floor(up%3600/60)).slice(-2)+"m · <b"+(A.unsourced?' class="bad"':'')+">token audit: "+A.checked+" checked · "+A.unsourced+" unsourced</b>";
  }
}
function reload(){
  ["handover/site.js","handover/heartbeat.js"].forEach(function(src,i){
    var s=document.createElement("script"); s.src=src+"?t="+Date.now();
    s.onload=function(){ if(i===1){ render(); tickAge(); } s.remove(); }; s.onerror=function(){ s.remove(); };
    document.body.appendChild(s);
  });
}
render(true); tickAge(); setTimeout(function(){document.body.className="ready"},1500);
setInterval(reload,3000);
setInterval(tickAge,1000);
setInterval(demoTab,1000);
</script>
</body>
